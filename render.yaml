# Render blueprint: one web service + one Postgres database.
# In Render: New + > Blueprint > pick this repo. It creates both and wires DATABASE_URL.
services:
  - type: web
    name: ledgerline
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    # init_db is idempotent: creates the schema and seed data on first boot, no-ops after.
    startCommand: python -m scripts.init_db && uvicorn app.main:app --host 0.0.0.0 --port $PORT --proxy-headers
    healthCheckPath: /healthz
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.7
      - key: DATABASE_URL
        fromDatabase:
          name: ledgerline-db
          property: connectionString
      - key: DB_POOL_SIZE
        value: "10"

databases:
  - name: ledgerline-db
    plan: free
    databaseName: ledgerline
