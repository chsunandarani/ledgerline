# Run everything with only Docker installed:
#   docker compose up --build        -> http://localhost:8000  (seed logins in README)
#   docker compose down -v           -> stop and delete the data
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: ledger
      POSTGRES_PASSWORD: ledger
      POSTGRES_DB: ledger
    ports: ["5432:5432"]          # so tests on your machine can reach it
    volumes: [dbdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ledger -d ledger"]
      interval: 2s
      retries: 30

  app:
    build: .
    environment:
      DATABASE_URL: postgresql://ledger:ledger@db/ledger
    ports: ["8000:8000"]
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

volumes:
  dbdata:
