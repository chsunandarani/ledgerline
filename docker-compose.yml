# Local run with nothing installed but Docker:  docker compose up --build
# then open http://localhost:8000
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: ledger
      POSTGRES_PASSWORD: ledger
      POSTGRES_DB: ledger
    ports: ["5432:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ledger"]
      interval: 2s
      retries: 20
  app:
    build: .
    environment:
      DATABASE_URL: postgresql://ledger:ledger@db/ledger
    ports: ["8000:8000"]
    depends_on:
      db:
        condition: service_healthy
